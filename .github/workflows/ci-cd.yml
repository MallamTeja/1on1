name: 1on1 CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-frontend:
    name: Frontend Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install pnpm
        run: corepack enable && corepack prepare pnpm@11.25.0 --activate

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck Frontend
        run: pnpm --filter 1on1-frontend run typecheck

      - name: Lint Frontend
        run: pnpm --filter 1on1-frontend run lint

      - name: Verify Navigation & Route Links
        run: pnpm --filter 1on1-frontend run check:links

      - name: Production Build
        run: pnpm --filter 1on1-frontend run build

  test-backend:
    name: Backend Test Suite & Security
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install pnpm
        run: corepack enable && corepack prepare pnpm@11.25.0 --activate

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Hermetic Auth & Security Tests (109 tests)
        run: pnpm --filter 1on1-backend test

  deploy-vercel:
    name: Deploy Frontend to Vercel
    needs: [test-frontend, test-backend]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push' && secrets.VERCEL_TOKEN != ''
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Deploy to Vercel
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          vercel-args: '--prod'
          working-directory: ./frontend

  deploy-aws:
    name: Deploy Backend to AWS Lightsail
    needs: [test-frontend, test-backend]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push' && secrets.LIGHTSAIL_SSH_KEY != ''
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH to Lightsail VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.LIGHTSAIL_HOST || '3.111.117.195' }}
          username: ${{ secrets.LIGHTSAIL_USER || 'ubuntu' }}
          key: ${{ secrets.LIGHTSAIL_SSH_KEY }}
          script: |
            cd /home/ubuntu/1on1 || exit 1
            git pull origin main
            pnpm install --frozen-lockfile
            pnpm --filter 1on1-backend run migrate:up
            pm2 restart 1on1-backend || pm2 start backend/src/server.js --name 1on1-backend
